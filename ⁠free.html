<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Free Section</title>
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 20px; margin-bottom: 5px; color: var(--accent); }
        p { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; background: rgba(0,255,204,0.1);
            border: 1px solid var(--accent); color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: block; text-align: center;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        .file-box {
            background: #080808; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 15px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: var(--text-sub); font-size: 14px; }
        .back-link a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>بەشی فڕی (Free Portal)</h1>
            <p>داگرتنی ڕاستەوخۆی فایلی IPA بێ کلیل (تاوەکو 2GB)</p>

            <div class="file-box">
                <div style="text-align: right;">
                    <h4 style="font-size: 15px; color: #fff;">فایلی IPA ی فڕی</h4>
                    <span style="font-size: 12px; color: var(--text-sub);">سنوور: تاوەکو 2GB • بێ کلیل</span>
                </div>
                <a href="free-app.ipa" class="btn" style="width: auto; padding: 10px 16px;" download>داگرتن</a>
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← گەڕانەوە بۆ سەرەکی</a>
        </div>
    </div>
</body>
</html>

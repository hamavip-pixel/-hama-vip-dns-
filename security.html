<!DOCTYPE html>
<html lang="ckb" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Security Portal</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --card-hover: #181818;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-sub);
        }

        .security-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .security-box:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .security-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            color: var(--text-main);
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .security-item:last-child {
            border-bottom: none;
        }

        .status-badge {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--text-sub);
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>بەشی سکوێریتی و پاراستن</h1>
            <p class="subtitle">دۆخی پاراستنی سیستمی پۆرتال</p>
        </div>

        <div class="security-box">
            <div class="security-item">
                <span>بارودۆخی سیستمی پۆرتال</span>
                <span class="status-badge">پارێزراوە (Secure)</span>
            </div>
            <div class="security-item">
                <span>واژۆی دیجیتاڵی</span>
                <span class="status-badge">فعالە (Active)</span>
            </div>
            <div class="security-item">
                <span>استاتۆسی پەیوەندی</span>
                <span class="status-badge">SSL / HTTPS</span>
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
        </div>
    </div>

</body>
</html>

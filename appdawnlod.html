<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAMA⚡️VIP | App Download</title>
    <link rel="icon" type="image/jpeg" href="IMG_0045.jpeg">
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --border-color: rgba(255, 215, 0, 0.3);
            --accent: #ffd700;
            --text-main: #ffffff;
            --text-sub: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .gold-border-box {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .gold-border-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotateGold 4s linear infinite;
        }
        @keyframes rotateGold {
            100% { transform: rotate(360deg); }
        }
        .card-inner {
            position: relative;
            background: var(--card-bg);
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            z-index: 2;
        }

        .logo-container {
            width: 80px; height: 80px; margin: 0 auto 12px auto; border-radius: 50%;
            border: 2px solid var(--accent); box-shadow: 0 0 15px rgba(255,215,0,0.4);
            overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        .vip-badge {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            letter-spacing: 1px;
        }
        h1 { font-size: 20px; margin-bottom: 5px; color: var(--accent); }
        p { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
        
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; background: rgba(255,215,0,0.1);
            border: 1px solid var(--accent); color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: block; text-align: center;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(255,215,0,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="gold-border-box">
            <div class="card-inner">
                <div class="logo-container">
                    <img src="IMG_0045.jpeg" alt="HAMA Logo">
                </div>
                <div class="vip-badge">HAMA⚡️VIP</div>

                <h1>دابەزاندنی ئەپڵیکەیشن</h1>
                <p>بۆ دابەزاندنی ڕاستەوخۆ بۆ سەر شاشەی سەرەکی (Home Screen)</p>
                
                <a href="itms-services://?action=download-manifest&url=https://hamavip-pixel.github.io/hx-speech/manifest.plist" class="btn" onclick="startInstall(this)">داونلۆدդ..</a>
            </div>
        </div>
    </div>

    <script>
        function startInstall(btn) {
            btn.innerText = "داونلۆدդ.. (دەست پێکرد)";
        }
    </script>
</body>
</html>

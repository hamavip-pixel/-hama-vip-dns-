<!DOCTYPE html>
<html lang="ckb" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Apps Portal</title>
    <link rel="icon" type="image/jpeg" href="IMG_0045.jpeg">
    <link rel="apple-touch-icon" href="IMG_0045.jpeg">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --card-hover: #181818;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 15px;
        }

        .app-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .app-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .app-info h3 {
            font-size: 16px;
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .app-info span {
            font-size: 12px;
            color: var(--text-sub);
        }

        .download-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background: var(--accent);
            color: #000;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: var(--text-sub);
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <h1>بەشی ئەپەکان</h1>
            <p class="subtitle">فایل و ئەپڵیکەیشنە بەردەستەکان بۆ داونلۆد</p>
        </div>

        <div class="app-item">
            <div class="app-info">
                <h3>HAMA VIP App</h3>
                <span>وەشانی نوێ • VIP Edition</span>
            </div>
            <a href="#" class="download-btn">داونلۆد</a>
        </div>

        <div class="back-link">
            <a href="index.html">← گەڕانەوە بۆ لاپەڕەی سەرەکی</a>
        </div>
    </div>

</body>
</html>

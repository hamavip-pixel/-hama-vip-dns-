<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Premium Section</title>
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 20px; margin-bottom: 5px; color: var(--accent); }
        p { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }
        .input-field {
            width: 100%; padding: 14px; background: #080808; border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-main); font-size: 14px; outline: none; text-align: center; margin-bottom: 12px;
        }
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; background: rgba(0,255,204,0.1);
            border: 1px solid var(--accent); color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent-glow); }
        .locked-content { display: none; margin-top: 15px; }
        .file-box {
            background: #080808; border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: var(--text-sub); font-size: 14px; }
        .back-link a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>بەشی تایبەتی پریمیۆم (Premium)</h1>
            <p>توانای داگرتنی فایلی IPA تاوەکو 5GB</p>

            <div id="keyActivationSection">
                <input type="text" id="proKeyInput" class="input-field" placeholder="کلیلەکەت لێرە بنووسە...">
                <button class="btn" onclick="activatePro()">چالاککردنی کلیل</button>
                <p id="msgResult" style="margin-top: 10px; font-size: 13px;"></p>
            </div>

            <div id="proContentSection" class="locked-content">
                <p style="color: var(--accent);">✓ بەشی پریمیۆم چالاکە (سنووری داگرتن: 5GB)</p>
                
                <div class="file-box">
                    <div style="text-align: right;">
                        <h4 style="font-size: 15px; color: #fff;">فایلی IPA (تایبەت)</h4>
                        <span style="font-size: 12px; color: var(--text-sub);">قەبارە: تاوەکو 5GB • IPA Format</span>
                    </div>
                    <a href="app.ipa" class="btn" style="width: auto; padding: 10px 16px;" download>داگرتن</a>
                </div>
            </div>
        </div>

        <div class="back-link">
            <a href="index.html">← گەڕانەوە بۆ سەرەکی</a>
        </div>
    </div>

    <script src="servarkey.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.HxServerKey && window.HxServerKey.isProActive()) {
                document.getElementById('keyActivationSection').style.display = 'none';
                document.getElementById('proContentSection').style.display = 'block';
            }
        });

        function activatePro() {
            let val = document.getElementById('proKeyInput').value;
            let res = window.HxServerKey.verifyKey(val);
            let msgBox = document.getElementById('msgResult');
            
            msgBox.innerText = res.msg;
            if (res.success) {
                msgBox.style.color = "#00ffcc";
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } else {
                msgBox.style.color = "#ff4444";
            }
        }
    </script>
</body>
</html>

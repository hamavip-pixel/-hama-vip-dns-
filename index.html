<!DOCTYPE html>
<html lang="ckb" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Ultimate Portal</title>
    <link rel="icon" type="image/jpeg" href="IMG_0045.jpeg">
    <link rel="apple-touch-icon" href="IMG_0045.jpeg">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --card-hover: #181818;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: var(--card-hover);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0,255,204,0.1), rgba(0,255,204,0.02));
            border-color: var(--accent);
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <div class="logo-container">
                <img src="IMG_0045.jpeg" alt="Hx-Speech Logo">
            </div>
            <h1>Hx-Speech Portal</h1>
            <p class="subtitle">سیستمی پارێزراو و تایبەتی پۆرتال</p>

            <a href="app.html" class="btn btn-primary">کردنەوەی بەشی ئەپەکان</a>
            <div style="height: 10px;"></div>
            <a href="security.html" class="btn">بەشی سکوریتی و پاراستن</a>
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hx-Speech | Ultimate Portal</title>
    <link rel="icon" type="image/jpeg" href="IMG_0045.jpeg">
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --border-color: rgba(0, 255, 204, 0.15);
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.25);
            --text-main: #ffffff;
            --text-sub: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            background: #181818;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .btn-pro { background: linear-gradient(135deg, rgba(0,255,204,0.15), rgba(0,255,204,0.02)); border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Hx-Speech Portal</h1>
            <p>سیستمی داگرتنی فایل و بەشی پریمیۆمی پارێزراو</p>
            
            <!-- لێرەدا کلیل بەستراوە بە premium.html کە کێشەی 404 چارەسەر دەکات -->
            <a href="premium.html" class="btn btn-pro">⭐ بەشی پریمیۆم (PRO) - داگرتنی تاوەکو 5GB</a>
            
            <!-- بەشی فڕی کە بەبێ کلیل تا 2GB دادەبەزێنێت -->
            <a href="free.html" class="btn">🌐 بەشی فڕی (Free) - داگرتنی تاوەکو 2GB</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAMA⚡️VIP | Ultimate Portal</title>
    <style>
        :root {
            --bg-color: #040404;
            --card-bg: #101010;
            --border-color: rgba(255, 215, 0, 0.3);
            --accent: #ffd700;
            --text-main: #ffffff;
            --text-sub: #888888;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; text-decoration: none; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; }
        
        /* خولانەوەی ڕەنگی گۆڵدی بە دەوری کارتەکەدا */
        .gold-border-box {
            position: relative;
            width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 3px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        .gold-border-box::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            animation: rotateGold 4s linear infinite;
        }
        @keyframes rotateGold {
            100% { transform: rotate(360deg); }
        }
        .card-inner {
            position: relative;
            background: var(--card-bg);
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            z-index: 2;
        }

        .vip-badge {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            letter-spacing: 1px;
        }
        h1 { font-size: 20px; margin-bottom: 5px; color: var(--accent); }
        p { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; }
        
        .input-field {
            width: 100%; padding: 14px; background: #080808; border: 1px solid var(--border-color);
            border-radius: 12px; color: var(--text-main); font-size: 14px; outline: none; text-align: center; margin-bottom: 12px;
        }
        .btn {
            width: 100%; padding: 14px; border-radius: 12px; background: rgba(255,215,0,0.1);
            border: 1px solid var(--accent); color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; display: block; text-align: center;
        }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(255,215,0,0.4); }
        
        .section-box { display: none; margin-top: 15px; text-align: right; }
        
        /* شێوازی بۆکسەکەی دادەنێیت (Drop Zone) */
        .drop-zone {
            border: 2px dashed rgba(255,215,0,0.4);
            border-radius: 16px;
            padding: 30px 15px;
            text-align: center;
            background: #080808;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .drop-zone:hover { border-color: var(--accent); }
        .upload-icon { font-size: 32px; color: var(--accent); margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="gold-border-box">
            <div class="card-inner">
                <div class="vip-badge">HAMA⚡️VIP</div>

                <div id="keyActivationSection">
                    <h1>بەشی پریمیۆم (PRO)</h1>
                    <p>داگرتنی فایل تاوەکو 5GB بە کلیل</p>
                    <input type="text" id="proKeyInput" class="input-field" placeholder="کلیلەکەت لێرە بنووسە...">
                    <button class="btn" onclick="activateProKey()">چالاککردنی کلیل</button>
                    <p id="msgResult" style="margin-top: 12px; font-size: 13px; text-align: center;"></p>
                </div>

                <div id="proContentSection" class="section-box">
                    <h1>بەشی پریمیۆم (PRO)</h1>
                    <p>فایلی IPA هەڵبژێرە بۆ داگرتن بۆ سەر Home Screen</p>
                    
                    <div class="drop-zone" onclick="document.getElementById('hiddenFileInput').click();">
                        <div class="upload-icon">⬆</div>
                        <p style="color: #fff; margin-bottom: 5px; font-size: 14px;">Drop your .ipa file here</p>
                        <span style="font-size: 11px; color: var(--text-sub);">Photo Library • Take Photo • Choose File</span>
                    </div>
                    
                    <input type="file" id="hiddenFileInput" style="display: none;" accept=".ipa,image/*,video/*" onchange="handleFileSelected(this)">

                    <div id="downloadActionBox" style="display: none; margin-top: 15px;">
                        <button id="downloadBtn" class="btn" onclick="startDownload()">داونلۆدդ..</button>
                    </div>

                    <button class="btn" style="margin-top: 15px; background: #1a1a1a; border-color: #444; color: #aaa;" onclick="goBackToKey()">← گەڕانەوە</button>
                </div>

            </div>
        </div>
    </div>

    <script src="servarkey.js"></script>
    <script>
        // پشکنینی پێشوەختە ئەگەر کلیل پێشتر چالاک بووبێت
        window.addEventListener('DOMContentLoaded', () => {
            if (window.HxServerKey && window.HxServerKey.isProActive()) {
                document.getElementById('keyActivationSection').style.display = 'none';
                document.getElementById('proContentSection').style.display = 'block';
            }
        });

        function activateProKey() {
            let val = document.getElementById('proKeyInput').value;
            let res = window.HxServerKey.verifyKey(val);
            let msgBox = document.getElementById('msgResult');
            
            if (res.success) {
                msgBox.style.color = "#ffd700";
                msgBox.innerText = "کلیلەکە ڕاست بوو\nچونەناو بەشی پڕووییم..";
                setTimeout(() => {
                    document.getElementById('keyActivationSection').style.display = 'none';
                    document.getElementById('proContentSection').style.display = 'block';
                }, 1200);
            } else {
                msgBox.style.color = "#ff4444";
                msgBox.innerText = res.msg;
            }
        }

        function handleFileSelected(input) {
            if (input.files && input.files[0]) {
                let fileName = input.files[0].name;
                document.getElementById('downloadActionBox').style.display = 'block';
                document.querySelector('.drop-zone p').innerText = "فایل هەڵبژێردرا: " + fileName;
            }
        }

        function startDownload() {
            let btn = document.getElementById('downloadBtn');
            btn.innerText = "داونلۆدդ..";
            
            // لێرەدا لینکەکەی فایلی IPA دەنوسیت یان ڕاستەوخۆ داگرتن دەست پێدەکات
            let link = document.createElement('a');
            link.href = "app.ipa"; // ناوی فایلی IPAت لێرە دەبێت
            link.download = "app.ipa";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function goBackToKey() {
            document.getElementById('proContentSection').style.display = 'none';
            document.getElementById('keyActivationSection').style.display = 'block';
        }
    </script>
</body>
</html>
